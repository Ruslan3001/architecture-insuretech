"""
Описывает корневые запросы для получения данных.
"""
type Query {
  """
  Получить информацию о клиенте по ID.
  Позволяет гибко запрашивать связанные сущности (документы, родственники) в одном запросе.
  """
  client(id: ID!): Client
}

"""
Описание клиента сервиса.
"""
type Client {
  "Уникальный идентификатор клиента"
  id: ID!
  "Имя клиента"
  name: String
  "Возраст клиента"
  age: Int
  "Список документов клиента. Загружается только при явном запросе."
  documents: [Document!]
  "Список родственников клиента. Загружается только при явном запросе."
  relatives: [Relative!]
}

"""
Документ, удостоверяющий личность клиента.
"""
type Document {
  "Уникальный идентификатор документа"
  id: ID!
  "Тип документа (например, 'паспорт РФ')"
  type: String
  "Номер документа"
  number: String
  "Дата выдачи в формате ISO 8601"
  issueDate: String
  "Дата окончания срока действия в формате ISO 8601"
  expiryDate: String
}

"""
Родственник клиента.
"""
type Relative {
  "Уникальный идентификатор родственника"
  id: ID!
  "Тип родства (например, 'супруг', 'ребенок')"
  relationType: String
  "Имя родственника"
  name: String
  "Возраст родственника"
  age: Int
}